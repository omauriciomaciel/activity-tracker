name: Build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: ubuntu (x86_64)
            os: ubuntu-22.04
            deb_arch: amd64
            rust_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            name: ubuntu (aarch64)
            os: ubuntu-22.04
            deb_arch: arm64
            rust_arch: aarch64
            cross: true
          - target: x86_64-apple-darwin
            name: macos (x86_64)
            os: macos-15-intel
          - target: aarch64-apple-darwin
            name: macos (aarch64)
            os: macos-latest

    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
        with:
          tool: cross

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}

      # ── Linux packaging ────────────────────────────────────────────────────

      - name: Package .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCH="${{ matrix.deb_arch }}"
          PKGNAME="activity-tracker_${VERSION}_${ARCH}"

          mkdir -p "${PKGNAME}/usr/bin"
          mkdir -p "${PKGNAME}/DEBIAN"

          cp "target/${{ matrix.target }}/release/activity-tracker" "${PKGNAME}/usr/bin/"
          chmod 755 "${PKGNAME}/usr/bin/activity-tracker"

          cat > "${PKGNAME}/DEBIAN/control" <<CTRL
          Package: activity-tracker
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: Mauricio <owldatalb@gmail.com>
          Description: Captura atividades do sistema e resume com Ollama
           Daemon that snapshots shell history, open windows, Chrome tabs and
           git context, then summarises the day with a local Ollama model.
          CTRL

          mkdir -p "${PKGNAME}/etc/profile.d"
          printf "alias at='activity-tracker'\nalias ats='activity-tracker summary'\n" \
            > "${PKGNAME}/etc/profile.d/activity-tracker.sh"
          chmod 644 "${PKGNAME}/etc/profile.d/activity-tracker.sh"

          fakeroot dpkg-deb --build "${PKGNAME}"

      - name: Package Linux .tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCH="${{ matrix.rust_arch }}"
          cp "target/${{ matrix.target }}/release/activity-tracker" .
          tar czf "activity-tracker-${VERSION}-linux-${ARCH}.tar.gz" \
            activity-tracker README.md install.sh

      # ── macOS packaging ────────────────────────────────────────────────────

      - name: Detect macOS arch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            echo "MAC_ARCH=aarch64" >> "$GITHUB_ENV"
          else
            echo "MAC_ARCH=x86_64" >> "$GITHUB_ENV"
          fi

      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCH="${MAC_ARCH}"

          brew install create-dmg 2>/dev/null || true

          mkdir -p dmg-staging
          cp "target/${{ matrix.target }}/release/activity-tracker" dmg-staging/
          cp install.sh dmg-staging/

          DMG="activity-tracker-${VERSION}-macos-${ARCH}.dmg"

          create-dmg \
            --volname "Activity Tracker ${VERSION}" \
            --window-size 400 200 \
            --icon-size 80 \
            --no-internet-enable \
            "${DMG}" \
            dmg-staging/ \
          || hdiutil create \
            -volname "Activity Tracker ${VERSION}" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "${DMG}"

      - name: Package macOS .tar.gz
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCH="${MAC_ARCH}"
          cp "target/${{ matrix.target }}/release/activity-tracker" .
          tar czf "activity-tracker-${VERSION}-macos-${ARCH}.tar.gz" \
            activity-tracker README.md install.sh

      # ── Upload ─────────────────────────────────────────────────────────────

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            *.deb
            *.tar.gz
            *.dmg
            *.zip
