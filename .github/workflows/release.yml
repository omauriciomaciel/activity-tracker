name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    outputs:
      released: ${{ steps.sem.outputs.released }}
      tag: ${{ steps.sem.outputs.tag }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "python-semantic-release==10.5.3"

      - name: Run semantic-release
        id: sem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish
          TAG=$(git tag --points-at HEAD 2>/dev/null | grep '^v' | head -1 || true)
          if [[ -n "$TAG" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write

  checksums:
    name: Checksums
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          tag: ${{ needs.release.outputs.tag }}
          fileName: "*"
          out-file-path: dist/

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum *.deb *.tar.gz *.dmg *.zip 2>/dev/null | sort > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/SHA256SUMS.txt
